title: Josip Stuhli
description: >-
  CTO at Sofascore. Engineering leader, conference speaker, and distributed systems enthusiast.
baseurl: ""
url: "https://stuhli.dev"

# Social sharing (used by jekyll-seo-tag for og:image / twitter:image)
# jekyll-seo-tag only reads `image` from page front matter, not from
# site config, so the default image is injected via front matter defaults.
image: /assets/og-image.png
twitter:
  username: jstuhli
  card: summary_large_image

defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-image.png

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Social links used in footer
social_links:
  - { name: "GitHub", url: "https://github.com/jstuhli" }
  - { name: "LinkedIn", url: "https://www.linkedin.com/in/jstuhli/" }
  - { name: "X / Twitter", url: "https://twitter.com/jstuhli" }

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
