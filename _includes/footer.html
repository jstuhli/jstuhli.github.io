<footer class="site-footer">
  <div class="footer-inner">
    <ul class="footer-links">
      {% for link in site.social_links %}
      <li><a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.name }}</a></li>
      {% endfor %}
    </ul>
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</p>
  </div>
</footer>
